name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Integration and e2e tests need a Postgres + PostGIS database.
  # Configure a dedicated Neon branch as repository secret DATABASE_URL_TEST.
  DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
  DEMO_MODE: "true"
  APP_URL: http://localhost:3000

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Migrate test database
        if: env.DATABASE_URL != ''
        run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST || 'postgresql://build:build@localhost:5432/build' }}

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: checks
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Skip when no test database is configured
        if: env.DATABASE_URL == ''
        run: echo "::warning::DATABASE_URL_TEST secret ontbreekt — e2e overgeslagen" && exit 0
      - if: env.DATABASE_URL != ''
        run: pnpm exec playwright install --with-deps chromium
      - if: env.DATABASE_URL != ''
        run: pnpm db:migrate && pnpm db:seed
      - if: env.DATABASE_URL != ''
        run: pnpm build
      - if: env.DATABASE_URL != ''
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
